<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;touch-action:none}
:root{--yellow:#ffe040;--pink:#ff7eb3;--purple:#9b5fd4;--green:#4dcf8a;--white:#fff}
#app{width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{flex-shrink:0;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);
  border-bottom:2px solid rgba(255,224,64,.35);padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between}
.topbar-name{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;color:var(--yellow)}
.topbar-sub{font-size:.62rem;font-weight:700;color:#aac4ff;margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-info-top,.btn-back{font-family:'Baloo 2',cursive;font-size:.7rem;font-weight:800;border-radius:999px;padding:6px 14px;cursor:pointer}
.btn-info-top{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:var(--white)}
.btn-back{background:#0f3460;color:var(--yellow);border:2px solid var(--yellow)}
#bg{position:absolute;inset:0;z-index:0;width:100%;height:100%}
.happy-wrap{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.happy-track{width:130px;height:11px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;border:1.5px solid rgba(255,255,255,.25)}
.happy-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .5s}
.happy-lbl{font-size:.5rem;font-weight:800;color:rgba(255,255,255,.65)}
#lore{position:absolute;top:68px;right:10px;z-index:25;background:rgba(10,5,30,.92);
  border:2px solid rgba(255,224,64,.4);border-radius:14px;padding:12px 14px;width:175px;
  display:none;flex-direction:column;gap:5px;backdrop-filter:blur(6px)}
#lore.show{display:flex}
.lore-title{font-family:'Baloo 2',cursive;font-size:.7rem;color:var(--yellow);font-weight:800}
.lore-desc{font-size:.5rem;color:#aac4ff;line-height:1.6;margin-bottom:4px}
.stat-row{display:flex;align-items:center;gap:5px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.stat-row:last-of-type{border:none}
.stat-name{font-size:.48rem;font-weight:800;color:#888;width:28px}
.stat-bar{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:999px}
.stat-val{font-size:.48rem;font-weight:800;color:var(--yellow);width:20px;text-align:right}
.lore-footer{font-size:.46rem;color:#666;margin-top:4px;line-height:1.7}
#stage{position:absolute;z-index:10;pointer-events:none;transform-origin:center bottom}
#stage svg{overflow:visible;display:block}
#speech{position:absolute;z-index:25;background:var(--white);border:2.5px solid #ddd;
  border-radius:18px 18px 18px 5px;padding:9px 14px;font-size:.78rem;font-weight:800;color:#333;
  max-width:210px;line-height:1.5;box-shadow:0 4px 18px rgba(0,0,0,.28);
  opacity:0;transition:opacity .3s;pointer-events:none}
#speech::after{content:'';position:absolute;bottom:-11px;left:18px;border:6px solid transparent;border-top-color:var(--white)}
#speech.show{opacity:1}
.tray{position:absolute;bottom:0;left:0;right:0;z-index:30;background:rgba(0,0,0,.8);
  backdrop-filter:blur(10px);border-top:2px solid rgba(255,224,64,.25);
  padding:10px 12px 22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tray-lbl{font-size:.52rem;font-weight:800;color:rgba(255,224,64,.5);letter-spacing:.08em}
.tray-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tool{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.09);
  border:2px solid rgba(255,255,255,.18);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:grab;user-select:none;touch-action:none;transition:all .2s}
.tool.on{background:rgba(255,224,64,.18);border-color:var(--yellow);box-shadow:0 0 16px rgba(255,224,64,.35);transform:scale(1.1)}
.ti{font-size:1.7rem;pointer-events:none}
.tl{font-size:.42rem;font-weight:800;color:#aac4ff;pointer-events:none}
#ghost{position:fixed;z-index:200;font-size:2.2rem;pointer-events:none;
  transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#ghost.on{opacity:1}
.sp{position:fixed;pointer-events:none;z-index:199;animation:spAnim .9s ease forwards}
@keyframes spAnim{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
.heart{position:fixed;pointer-events:none;z-index:50;animation:heartUp 1.1s ease forwards}
@keyframes heartUp{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-80px) scale(1.4);opacity:0}}
#accPick{
  position:fixed;bottom:148px;left:0;right:0;
  z-index:35;background:rgba(8,4,24,.97);border-top:2px solid var(--yellow);
  border-radius:20px 20px 0 0;padding:12px 12px 18px;display:none;
  flex-direction:column;align-items:center;gap:10px;backdrop-filter:blur(12px);
  max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#accPick.show{display:flex}
.acc-tab-btn{font-family:'Baloo 2',cursive;font-size:.58rem;font-weight:800;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
  border-radius:999px;padding:5px 12px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s;}
.acc-tab-btn.active{background:rgba(255,224,64,.18);border-color:#ffe040;color:#ffe040;}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
  border-radius:12px;padding:8px 4px;cursor:pointer;transition:all .2s;position:relative;}
.shop-item.owned{border-color:rgba(77,207,138,.4);background:rgba(77,207,138,.08);}
.shop-item.equipped{border-color:#ffe040;background:rgba(255,224,64,.1);}
.shop-item.cant-afford{opacity:.5;cursor:default;}
.shop-item:hover:not(.cant-afford){background:rgba(255,255,255,.12);}
.shop-price{font-family:'Baloo 2',cursive;font-size:.52rem;font-weight:800;
  color:#ffe040;display:flex;align-items:center;gap:2px;}
.shop-label{font-size:.48rem;font-weight:800;color:rgba(255,255,255,.7);text-align:center;
  max-width:60px;line-height:1.2;}
.shop-owned-badge{position:absolute;top:-4px;right:-4px;background:#4dcf8a;
  color:#0a2010;font-size:.4rem;font-weight:800;border-radius:999px;padding:2px 5px;}
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.85;
  transform:scale(1.15);transition:none;}
.acc-title-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 2px}
.acc-title{font-family:'Baloo 2',cursive;font-size:.72rem;color:var(--yellow);font-weight:800}
.btn-clear-all{font-family:'Baloo 2',cursive;font-size:.55rem;font-weight:800;
  background:rgba(255,60,60,.2);border:1.5px solid rgba(255,80,80,.5);
  color:#ff8888;border-radius:999px;padding:4px 12px;cursor:pointer}
.acc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;overflow-y:auto;max-height:calc(65vh - 120px)}
.acc-opt{
  cursor:pointer;border-radius:12px;border:2px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px 6px;transition:all .18s;position:relative;
}
.acc-opt.on{
  border-color:var(--yellow);background:rgba(255,224,64,.15);
  box-shadow:0 0 12px rgba(255,224,64,.25);
}
.acc-opt.on::after{content:'✓';position:absolute;top:3px;right:5px;
  font-size:.5rem;font-weight:900;color:var(--yellow)}
.acc-opt:active{transform:scale(.9)}
.acc-opt svg{display:block}
.acc-opt-label{font-size:.4rem;font-weight:800;color:#8899cc;text-align:center;
  line-height:1.3;padding:0 2px;}
.acc-opt.on .acc-opt-label{color:var(--yellow)}
.zzz{position:absolute;top:-30px;right:-20px;font-size:1.6rem;z-index:15;
  animation:zzzFloat 1.8s ease-in-out infinite alternate;pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(100,150,255,.6));}
@keyframes zzzFloat{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-10px) rotate(8deg)}}
/* Accessories are now inline SVG - no floating div needed */
.part{position:absolute;pointer-events:none;z-index:3;font-size:.85rem;opacity:.7;animation:partFloat linear infinite}
@keyframes partFloat{0%{transform:translateY(0) rotate(0deg);opacity:.7}100%{transform:translateY(-50px) rotate(30deg);opacity:0}}
</style>
</head>

    <div class="tray-row" id="toolsRow"></div>
  </div>
</div>
<div id="ghost"></div>

function getBuilder(name){

// ═══════════════════════════════════════════
//  ANIMATION ENGINE
// ═══════════════════════════════════════════
let animT=0, rafId=null, currentName='';

// Blink state
let blinkTimer=90, blinkNext=160, isBlinking=false, blinkFrame=0;
// Fluffkin
let isHopping=false, hopPhase=0, hopTimer=250, earWigglePhase=0;
// Sparklox
let tailWag=0, foxEarPhase=0;
// Puddlum  
let isClapping=false, clapPhase=0, clapTimer=200, rockPhase=0;
// Driftail
let wingFlap=0;
// Lunabelle
let headAngle=0, headDir=1, headTimer=120, tuftPhase=0;

function startAnim(name){
  currentName=name; animT=0;
  blinkTimer=60+Math.random()*100; blinkNext=120+Math.random()*160;
  isHopping=false; hopTimer=180+Math.random()*200;
  isClapping=false; clapTimer=160+Math.random()*180;
  headAngle=0; headTimer=90+Math.random()*90;
  tailWag=0; wingFlap=0; rockPhase=0;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(al);
}

function el(id){ return document.getElementById(id); }

function al(){
  rafId=requestAnimationFrame(al);
  animT++;
  if(!el('cSvg')) return;
  try{

  // ── BREATHING + LEAN: single combined transform for body (awake only) ──
  const bg=el('bodyGroup');
  if(bg && !isHopping && !appState.sleeping){
    const breathe=Math.sin(animT*.038)*0.055; // bigger breathe
    // Smooth lean toward cursor
    if(_mouseX){
      const cSvgEl=el('cSvg');
      if(cSvgEl){
        const sr=cSvgEl.getBoundingClientRect();
        const rawX=(_mouseX-(sr.left+sr.width/2))/Math.max(sr.width,1);
        _bodyLeanTarget=Math.max(-6, Math.min(6, rawX*12));
      }
    }
    _bodyLean+=(_bodyLeanTarget-_bodyLean)*0.08; // responsive
    bg.style.transform=`scaleY(${(1+breathe).toFixed(4)}) scaleX(${(1-breathe*.4).toFixed(4)}) rotate(${_bodyLean.toFixed(2)}deg)`;
  }

  // ── BLINKING / SLEEPING EYES ──
  const lidL=el('lidL'), lidR=el('lidR');
  const eyeL=el('eyeL'), eyeR=el('eyeR');

  if(appState.sleeping){
    // Eyes stay fully closed while sleeping
    if(lidL){ lidL.style.display='block'; lidL.setAttribute('ry','11'); }
    if(lidR){ lidR.style.display='block'; lidR.setAttribute('ry','11'); }
    if(eyeL) eyeL.style.filter='brightness(.1)';
    if(eyeR) eyeR.style.filter='brightness(.1)';
    isBlinking=false; // reset blink state
  } else {
    // Normal blinking when awake
    blinkTimer--;
    if(blinkTimer<=0 && !isBlinking){ isBlinking=true; blinkFrame=0; }
    if(isBlinking){
      blinkFrame++;
      if(blinkFrame===1){
        if(lidL){ lidL.style.display='block'; lidL.setAttribute('ry','11'); }
        if(lidR){ lidR.style.display='block'; lidR.setAttribute('ry','11'); }
        if(eyeL) eyeL.style.filter='brightness(.15)';
        if(eyeR) eyeR.style.filter='brightness(.15)';
      } else if(blinkFrame===4){
        if(lidL) lidL.setAttribute('ry','5');
        if(lidR) lidR.setAttribute('ry','5');
        if(eyeL) eyeL.style.filter='brightness(.5)';
        if(eyeR) eyeR.style.filter='brightness(.5)';
      } else if(blinkFrame===7){
        if(lidL) lidL.style.display='none';
        if(lidR) lidR.style.display='none';
        if(eyeL) eyeL.style.filter='';
        if(eyeR) eyeR.style.filter='';
      } else if(blinkFrame===12){
        isBlinking=false;
        blinkTimer=blinkNext;
        blinkNext=140+Math.random()*200;
      }
    }
  }

  // ── EYE TRACKING: pupils follow cursor/touch (skip when sleeping) ──
  if(!isBlinking && !appState.sleeping){
    const cSvgEl=el('cSvg');
    if(cSvgEl && _mouseX && _mouseY){
      const sr=cSvgEl.getBoundingClientRect();
      // Center of SVG on screen
      const scx=sr.left+sr.width/2;
      const scy=sr.top+sr.height/2;
      // Direction to cursor (normalized, capped)
      const rawX=(_mouseX-scx)/Math.max(sr.width,1);
      const rawY=(_mouseY-scy)/Math.max(sr.height,1);
      const dist=Math.sqrt(rawX*rawX+rawY*rawY);
      const scale=dist>1?1/dist:1; // normalize
      const targetX=rawX*scale*4.5; // max 4.5px pupil travel
      const targetY=rawY*scale*3.5;
      // Smooth interpolation
      _lookAtX+=(_lookAtX===0&&_lookAtY===0)?targetX:( targetX-_lookAtX)*_lookSmooth;
      _lookAtY+=(_lookAtY===0&&_lookAtY===0)?targetY:(targetY-_lookAtY)*_lookSmooth;
      _lookAtX+=(targetX-_lookAtX)*_lookSmooth;
      _lookAtY+=(targetY-_lookAtY)*_lookSmooth;
    }
    // Add subtle idle drift when cursor isn't near
    const idleDrift = Math.abs(_lookAtX)<0.5 && Math.abs(_lookAtY)<0.5;
    const ex = _lookAtX + (idleDrift ? Math.sin(animT*.018)*1.2 : 0);
    const ey = _lookAtY + (idleDrift ? Math.sin(animT*.022)*.6 : 0);
    const pupils=document.querySelectorAll('#cSvg circle[fill="#111"]');
    pupils.forEach(p=>{ p.style.transform=`translate(${ex.toFixed(2)}px,${ey.toFixed(2)}px)`; });
  }

  // ── RANDOM IDLE ACTIONS: occasional look-around, stretch, shake ──
  if(!appState.sleeping && !isHopping && !isClapping && animT>120){
    if(animT%240===0 && Math.random()<0.6){
      _doIdleAction();
    }
  }

  // ── IDLE EXCITEMENT: creature perks up when cursor enters ──
  if(_idleExcited && _excitedTimer>0){
    _excitedTimer--;
    // Use stage translateY only - no conflict with bodyGroup
    const st=el('stage');
    if(st && !isHopping){
      const bounce=Math.sin(_excitedTimer*0.35)*Math.min(_excitedTimer/40,1)*5;
      st.style.transform=`translateY(${-Math.abs(bounce)}px)`;
    }
    if(_excitedTimer<=0){
      _idleExcited=false;
      const st=el('stage');
      if(st&&!isHopping) st.style.transform='';
    }
  }

  // ── IDLE BOB / SLEEP DROOP ──
  if(appState.sleeping){
    // Sleeping posture: drooped forward, slight slow sway
    const st=el('stage');
    const bg=el('bodyGroup');
    if(st){
      const sleepSway=Math.sin(animT*.012)*3; // very slow breathing sway
      st.style.transform=`rotate(${-8+sleepSway}deg) translateY(8px)`;
    }
    if(bg){
      // Body slightly compressed/slouched
      const breathe=Math.sin(animT*.025)*0.03; // slower, shallower breathing
      bg.style.transform=`scaleY(${0.92+breathe}) scaleX(${1.06-breathe*.3}) rotate(${_bodyLean*.1}deg)`;
    }
  } else if(!isHopping && !isClapping && !_idleExcited && _excitedTimer<=0){
    const st=el('stage');
    if(st){
      const bob=Math.sin(animT*.028)*7;
      if(!st.style.transform || st.style.transform==='' || st.style.transform.includes('translateY')){
        const sway=Math.sin(animT*.018)*2.5;
        st.style.transform=`translateY(${bob.toFixed(2)}px) rotate(${sway.toFixed(2)}deg)`;
      }
    }
  }



  // ── CREATURE-SPECIFIC ANIMATIONS ──
  const arch = ARCHETYPE[currentName];
  const animName = CD[currentName] ? currentName : (arch||'Fluffkin');
  if(animName==='Fluffkin')   animFluffkin();
  else if(animName==='Sparklox') animSparklox();
  else if(animName==='Puddlum')  animPuddlum();
  else if(animName==='Driftail') animDriftail();
  else if(animName==='Lunabelle') animLunabelle();
  }catch(e){ /* suppress per-frame errors */ }
}

// ── FLUFFKIN: ear twitches, tail wag, periodic hops ──
function animFluffkin(){
  earWigglePhase+=.07;
  const earL=el('earL'), earR=el('earR'), tail=el('tail');
  // Independent ear movement — left twitches more
  if(earL) earL.style.transform=`rotate(${Math.sin(earWigglePhase)*6 + Math.sin(animT*.15)*2}deg)`;
  if(earR) earR.style.transform=`rotate(${Math.sin(earWigglePhase+1.4)*4}deg)`;
  // Tail wag
  // Wag faster when cursor is near
  const wagSpeed = (_idleExcited || _excitedTimer>0) ? .18 : .09;
  const wagAmp = (_idleExcited || _excitedTimer>0) ? 28 : 16;
  if(tail) tail.style.transform=`rotate(${Math.sin(animT*wagSpeed)*wagAmp}deg)`;
  // Hop
  hopTimer--;
  if(hopTimer<=0 && !isHopping){ isHopping=true; hopPhase=0; hopTimer=200+Math.random()*240; }
  if(isHopping){
    hopPhase++;
    const st=el('stage');
    if(st){
      // Arc jump: goes up then comes down with squash on landing
      const progress=hopPhase/22;
      const hy=-Math.sin(progress*Math.PI)*42;
      // Squash at peak, stretch going up
      const sx=progress<.5 ? 1-progress*.08 : 1-(1-progress)*.08;
      const sy=progress<.5 ? 1+progress*.1  : 1+(1-progress)*.1;
      // Landing squash
      const landSX = hopPhase===21 ? 1.18 : hopPhase===22 ? 1.1 : sx;
      const landSY = hopPhase===21 ? .78  : hopPhase===22 ? .88 : sy;
      st.style.transform=`translateY(${hy}px) scaleX(${landSX}) scaleY(${landSY})`;
    }
    if(hopPhase>22){ isHopping=false; if(el('stage')) el('stage').style.transform=''; }
  }
}

// ── SPARKLOX: tail wag with physics, ear flick ──
function animSparklox(){
  tailWag+=.08;
  foxEarPhase+=.05;
  const tail=el('tail'), earL=el('earL'), earR=el('earR');
  // Tail has a slight lag/spring feel via sin + offset
  if(tail){
    const wag=Math.sin(tailWag)*32 + Math.sin(tailWag*1.7)*8;
    tail.style.transform=`rotate(${wag}deg)`;
  }
  // Occasional ear flick
  const flick=Math.sin(foxEarPhase)*5;
  if(earL) earL.style.transform=`rotate(${flick}deg)`;
  if(earR) earR.style.transform=`rotate(${Math.sin(foxEarPhase+.8)*4}deg)`;
}

// ── PUDDLUM: body rock, flipper sway, clap, tiny bounce ──
function animPuddlum(){
  rockPhase+=.045;
  const flipL=el('flipL'), flipR=el('flipR'), bg=el('bodyGroup');
  const rock=Math.sin(rockPhase)*5;
  // Override body transform to add rock on top of breathing
  if(bg){
    const breathe=Math.sin(animT*.038)*0.016;
    // Include lean in Puddlum's rock too
    bg.style.transform=`scaleY(${(1+breathe).toFixed(4)}) scaleX(${(1-breathe*.4).toFixed(4)}) rotate(${(rock+_bodyLean).toFixed(2)}deg)`;
  }
  clapTimer--;
  if(clapTimer<=0 && !isClapping){ isClapping=true; clapPhase=0; clapTimer=180+Math.random()*180; }
  if(isClapping){
    clapPhase++;
    const ca=Math.sin(clapPhase*.45)*42;
    if(flipL) flipL.style.transform=`rotate(${-ca}deg)`;
    if(flipR) flipR.style.transform=`rotate(${ca}deg)`;
    // Small excited bounce during clap
    const st=el('stage');
    if(st) st.style.transform=`translateY(${-Math.abs(Math.sin(clapPhase*.45))*8}px)`;
    if(clapPhase>28){
      isClapping=false;
      if(flipL) flipL.style.transform='';
      if(flipR) flipR.style.transform='';
      if(el('stage')) el('stage').style.transform='';
    }
  } else {
    // Gentle resting flipper sway
    const sw=Math.sin(animT*.058)*10;
    if(flipL) flipL.style.transform=`rotate(${-sw}deg)`;
    if(flipR) flipR.style.transform=`rotate(${sw}deg)`;
  }
}

// ── DRIFTAIL: wing flap, tail flame sway, occasional stomp ──
function animDriftail(){
  wingFlap+=.068;
  const wingL=el('wingL'), wingR=el('wingR'), tail=el('tail');
  // Wing flap — asymmetric for life
  const fa=Math.sin(wingFlap)*14 + Math.sin(wingFlap*2+.5)*3;
  if(wingL) wingL.style.transform=`rotate(${fa}deg)`;
  if(wingR) wingR.style.transform=`rotate(${-fa}deg)`;
  // Tail sways with gentle flame undulation
  if(tail) tail.style.transform=`rotate(${Math.sin(animT*.042)*10}deg)`;
  // Occasional small stomp - use a flag to prevent stacking
  if(animT%280===0 && !animDriftail._stomping){
    animDriftail._stomping=true;
    const st=el('stage');
    if(st){
      let f=0;
      const iv=setInterval(()=>{
        f++;
        if(f<3) st.style.transform=`translateY(4px) scaleX(1.06) scaleY(.94)`;
        else if(f<6) st.style.transform=`translateY(-6px) scaleX(.96) scaleY(1.06)`;
        else if(f<9) st.style.transform=`translateY(2px)`;
        else { clearInterval(iv); if(st) st.style.transform=''; animDriftail._stomping=false; }
      },50);
    }
  }
}

// ── LUNABELLE: head look-around, tuft sway, halo pulse, wing settle ──
function animLunabelle(){
  tuftPhase+=.055;
  headTimer--;
  if(headTimer<=0){ headDir*=-1; headTimer=70+Math.random()*100; }
  // Smooth angle interpolation
  const targetAngle=headDir*24;
  headAngle+=(targetAngle-headAngle)*.025;

  // Rotate just the head area via full SVG rotation around head center
  const svg=el('cSvg');
  if(svg){ svg.style.transformBox='fill-box'; svg.style.transformOrigin='110px 110px'; svg.style.transform=`rotate(${headAngle*.35}deg)`; }

  const tuftL=el('tuftL'), tuftR=el('tuftR');
  if(tuftL) tuftL.style.transform=`rotate(${Math.sin(tuftPhase)*7}deg)`;
  if(tuftR) tuftR.style.transform=`rotate(${Math.sin(tuftPhase+1)*6}deg)`;

  // Wing settle
  const wingL=el('wingL'), wingR=el('wingR');
  const ws=Math.sin(animT*.038)*5;
  if(wingL) wingL.style.transform=`rotate(${ws}deg)`;
  if(wingR) wingR.style.transform=`rotate(${-ws}deg)`;

  // Moon halo breathe
  const halo=el('moonHalo');
  if(halo){ const p=.22+Math.sin(animT*.048)*.14; halo.setAttribute('stroke',`rgba(255,220,80,${p})`); }
}

function squashStretch(stage, frames){
  // frames: array of [scaleX, scaleY, ms]
  let i=0;
  function next(){
    if(i>=frames.length){ stage.style.transform=''; return; }
    const [sx,sy,ms]=frames[i++];
    stage.style.transform=`scaleX(${sx}) scaleY(${sy})`;
    setTimeout(next,ms);
  }
  next();
}

function reactPet(){
  const st=el('stage'), he=el('heartEyes');
  if(he){ he.style.display='block'; setTimeout(()=>{ if(he) he.style.display='none';},2000); }
  // Quick excited wiggle before the squash
  let prePh=0;
  const preWig=setInterval(()=>{
    prePh++;
    if(st) st.style.transform=`rotate(${Math.sin(prePh*1.2)*8}deg) translateY(${-Math.abs(Math.sin(prePh*.8))*4}px)`;
    if(prePh>8){ clearInterval(preWig); if(st) st.style.transform=''; }
  },30);
  setTimeout(()=>{
  // Big squish (wide/flat) then bounce up (narrow/tall) then settle
  squashStretch(st,[
    [1.22,.78,80],[.92,1.14,80],[1.1,.9,70],[.96,1.06,70],[1.0,1.0,60]
  ]);
  },250);
  setTimeout(()=>{ if(he) he.style.display='none'; }, 2200);
}

function reactFeed(){
  const mn=el('mn'), mc=el('mc'), st=el('stage');
  if(mn) mn.style.display='none';
  if(mc) mc.style.display='block';
  // Anticipation lean back, then lunge forward to chomp
  let f=0;
  const iv=setInterval(()=>{
    f++;
    if(f<=4){
      // Lean back
      if(st) st.style.transform=`translateX(${-f*2}px) rotate(${-f}deg)`;
    } else if(f<=8){
      // Lunge forward + chomp squash
      if(st) st.style.transform=`translateX(${(f-4)*4}px) scaleX(1.14) scaleY(.86) rotate(2deg)`;
    } else if(f<=14){
      // Chewing bounce
      const chew=Math.sin((f-8)*0.9)*0.06;
      if(st) st.style.transform=`scaleX(${1+chew}) scaleY(${1-chew})`;
    } else if(f<=18){
      // Settle
      if(st) st.style.transform='';
    } else {
      clearInterval(iv);
      if(mn) mn.style.display='block';
      if(mc) mc.style.display='none';
      if(st) st.style.transform='';
    }
  },55);
}

function reactBrush(){
  const st=el('stage');
  // Lean into the brush - tilt one way, blissful
  let f=0;
  const iv=setInterval(()=>{
    f++;
    // Slow lean to right, then left, then settle contentedly
    const angle=Math.sin(f*.28)*12;
    const tx=Math.sin(f*.28)*6;
    if(st) st.style.transform=`rotate(${angle}deg) translateX(${tx}px)`;
    if(f>42){ clearInterval(iv); if(st) st.style.transform=''; }
  },40);
}

function reactCuddle(){
  const st=el('stage');
  // Slow gentle sway then droop down
  let f=0;
  const iv=setInterval(()=>{
    f++;
    if(f<20){
      if(st) st.style.transform=`rotate(${Math.sin(f*.2)*8}deg)`;
    } else {
      // Droop
      const droop=Math.min(1,(f-20)/15);
      if(st) st.style.transform=`rotate(${-5*droop}deg) scaleY(${1-droop*.04})`;
    }
    if(f>35){ clearInterval(iv); }
  },45);
}

function drawSun(x,y,r){ctx.fillStyle='#FFE566';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,220,80,.38)';ctx.lineWidth=r*.38;for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*(r+4),y+Math.sin(a)*(r+4));ctx.lineTo(x+Math.cos(a)*(r+13),y+Math.sin(a)*(r+13));ctx.stroke();}}
function drawCloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.87)';[[0,0,s*.42],[s*.32,-s*.18,s*.38],[s*.62,0,s*.32]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(x+dx,y+dy,r,0,Math.PI*2);ctx.fill();});}
function flower(x,y,c){ctx.fillStyle=c;for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(x+Math.cos(i*60*Math.PI/180)*6.5,y+Math.sin(i*60*Math.PI/180)*6.5,3.5,6.5,i*60*Math.PI/180,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#FFE040';ctx.beginPath();ctx.arc(x,y,3.8,0,Math.PI*2);ctx.fill();}
function coral(x,y,c){ctx.strokeStyle=c;ctx.lineWidth=4.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-27);ctx.moveTo(x,y-14);ctx.lineTo(x-13,y-29);ctx.moveTo(x,y-14);ctx.lineTo(x+13,y-29);ctx.stroke();}
function mush(x,y,c){ctx.fillStyle='#7a4a20';ctx.fillRect(x-3.8,y-15,7.5,15);ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y-15,17,13,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.48)';ctx.beginPath();ctx.arc(x-5,y-19,4.2,0,Math.PI*2);ctx.fill();}
function pine(x,y,c){ctx.fillStyle=c;[[0,-42,15],[0,-27,21],[0,-11,27]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.moveTo(x+dx-r,y+dy+r);ctx.lineTo(x+dx,y+dy-r);ctx.lineTo(x+dx+r,y+dy+r);ctx.fill();});ctx.fillStyle='#5a3010';ctx.fillRect(x-3.8,y,7.5,11);}

let appState={name:'',color:'',word:'',happy:50,acc:null,sleeping:false,lore:null};

function initCreature(name,color,word,happy,coins,purchasedAccs,accPositions){
  const data=CD[name]||CD[ARCHETYPE[name]||'Fluffkin'];
  appState={name,color,word,happy:happy||50,acc:null,sleeping:false,lore:data,
    coins:coins||0,
    purchasedAccs:purchasedAccs||{}, // {creatureName: [accId, ...]}
    accPositions:accPositions||{},    // {accId: {dx,dy}} offset transform
    accSet:new Set()
  };
  curHab=data.bgType||'meadow';
  drawHab(curHab);

  const builder=getBuilder(name);
  const stage=document.getElementById('stage');
  stage.innerHTML=builder(color);
  stage.style.transform='';

  // Scale and position
  const trayH=148,topH=56;
  const avH=window.innerHeight-topH-trayH;
  const svgW=260,svgH=290;
  const sf=Math.min((window.innerWidth*.88)/svgW,(avH*.88)/svgH);
  const sw=svgW*sf,sh=svgH*sf;
  stage.style.position='absolute';
  stage.style.left=((window.innerWidth-sw)/2)+'px';
  stage.style.top=(topH+(avH-sh)/2)+'px';
  stage.style.width=sw+'px';stage.style.height=sh+'px';
  stage.style.transformOrigin='center bottom';

  document.getElementById('topName').textContent=name;
  document.getElementById('topSub').textContent=`${data.habitat} Creature • Lv.${data.lv} • ${data.type} Type`;

  document.getElementById('loreName').textContent=name;
  document.getElementById('loreDesc').textContent=data.desc;
  const stats=[{n:'HP',v:data.hp,c:'#4dcf8a'},{n:'ATK',v:data.atk,c:'#ff5252'},{n:'DEF',v:data.def,c:'#aac4ff'},{n:'SPD',v:data.spd,c:'#ffe040'}];
  document.getElementById('loreStats').innerHTML=stats.map(s=>`<div class="stat-row"><div class="stat-name">${s.n}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${s.v}%;background:${s.c}"></div></div><div class="stat-val">${s.v}</div></div>`).join('');
  document.getElementById('loreFoot').innerHTML=`🏠 ${data.habitat} &nbsp;•&nbsp; 🌡 ${data.climate}<br>🍽 Loves ${data.food}`;

  // Clear any old accessories
  appState.acc = null;
  appState.accSet = new Set();
  updateHappy();buildTools();buildAccPicker();startParts();startAnim(name);
  // Restore previously placed accessories with their positions
  setTimeout(_restoreAccPositions, 300); // slight delay so SVG is rendered
}

function _restoreAccPositions(){
  const cSvg=document.getElementById('cSvg');
  if(!cSvg||!appState.accPositions) return;
  const positions=appState.accPositions;
  const owned=getPurchasedForCreature();
  const accs=getCreatureAccs();
  
  Object.keys(positions).forEach(function(accId){
    if(!owned.has(accId)) return; // not owned, skip
    const accDef=accs.find(function(a){return a.id===accId;});
    if(!accDef) return;
    
    const pos=positions[accId];
    const dx=pos.dx||pos.cx||0;
    const dy=pos.dy||pos.cy||0;
    
    // Remove any existing instance
    const existing=cSvg.querySelector('#acc_'+accId);
    if(existing) existing.remove();
    
    // Re-render at saved position
    const svgStr=accDef.svg(appState.color||'#ffb3d9');
    const ns='http://www.w3.org/2000/svg';
    const tmp=document.createElementNS(ns,'g');
    tmp.innerHTML=svgStr;
    const child=tmp.firstElementChild;
    if(child){
      child.setAttribute('transform',`translate(${dx.toFixed(1)},${dy.toFixed(1)})`);
      cSvg.appendChild(child);
      appState.accSet.add(accId);
    }
  });
  buildAccPicker(); // Update equipped tab to show active accessories
}

function buildTools(){
  const d=appState.lore,row=document.getElementById('toolsRow');
  row.innerHTML='';
  TOOLS.forEach(t=>{
    let icon=t.icon,lbl=t.lbl;
    if(t.id==='brush'&&!d.furry){icon='✨';lbl='Sparkle';}
    if(t.id==='feed'){icon=d.food;}
    const el=document.createElement('div');
    el.className='tool';el.id='tool_'+t.id;
    el.innerHTML=`<span class="ti">${icon}</span><span class="tl">${lbl}</span>`;
    el.addEventListener('mousedown',e=>startDrag(e,{...t,icon,lbl}));
    el.addEventListener('touchstart',e=>startDrag(e,{...t,icon,lbl}),{passive:false});
    row.appendChild(el);
  });
}

function startDrag(e,tool){
  e.preventDefault();
  getCareCtx(); // unlock audio on first touch
  if(appState.sleeping&&tool.id!=='pet'){speak("Shhh… sleeping! Pet me to wake up 😴");playCareSound('no');return;}
  if(tool.id==='acc'){toggleAcc();return;}
  activeTool=tool;dragging=true;
  const pt=e.touches?e.touches[0]:e;dX=pt.clientX;dY=pt.clientY;
  const g=document.getElementById('ghost');g.textContent=tool.icon;g.style.left=dX+'px';g.style.top=dY+'px';g.classList.add('on');
  document.getElementById('tool_'+tool.id)?.classList.add('on');
}

  if(e.touches[0]){ _mouseX=e.touches[0].clientX; _mouseY=e.touches[0].clientY; }

function mv(e){
  if(!dragging)return;e.preventDefault();
  const pt=e.touches?e.touches[0]:e;dX=pt.clientX;dY=pt.clientY;
  const g=document.getElementById('ghost');g.style.left=dX+'px';g.style.top=dY+'px';

    const dx2=dX-lastSpX,dy2=dY-lastSpY;
    if(Math.sqrt(dx2*dx2+dy2*dy2)>18){spawnSpark(dX,dY);lastSpX=dX;lastSpY=dY;}
  }
}
let _lastTapTime=0;
function up(){
  if(!dragging)return;dragging=false;
  const g=document.getElementById('ghost');g.classList.remove('on');
  if(activeTool){
    document.getElementById('tool_'+activeTool.id)?.classList.remove('on');
    if(overCreature(dX,dY)) doAction(activeTool.id);
    activeTool=null;
  } else if(overCreature(dX,dY)){
    // No tool - bare tap/click on creature
    if(appState.sleeping){
      // ANY tap wakes them up
      appState.sleeping=false;
      removeSleepZ();
      // Open eyes immediately
      const lidL=el('lidL'),lidR=el('lidR'),eyeL=el('eyeL'),eyeR=el('eyeR');
      if(lidL) lidL.style.display='none';
      if(lidR) lidR.style.display='none';
      if(eyeL) eyeL.style.filter='';
      if(eyeR) eyeR.style.filter='';
      // Reset posture
      const st=el('stage'); if(st) st.style.transform='';
      blinkTimer=60; // short delay before first blink
      speak(['Yawn… good morning! 😊','Hm? Oh! Hi! 😄','Zzz… wha?! 😮'][Math.floor(Math.random()*3)]);
      hearts('💕',5);
      playCareSound('pet');
    } else {
      const now=Date.now();
      if(now-_lastTapTime<400){
        // Double-tap: excited jump
        _idleExcited=true; _excitedTimer=100;
        speak(['Hehe! Again! 😄','You found my tickle spot! 🤣','Wheee! 🎉'][Math.floor(Math.random()*3)]);
        playCareSound('pet');
      } else {
        // Single tap: wink
        _doWink();
        speak(['Hi! 😊','Tap me again! 😄','Hehe~ 🐾'][Math.floor(Math.random()*3)]);
      }
      _lastTapTime=now;
    }
  }
  lastSpX=lastSpY=-999;
}

function _doWink(){
  // Close one eye briefly
  const side=Math.random()<0.5?'L':'R';
  const lid=el('lid'+side), eye=el('eye'+side);
  if(!lid||!eye) return;
  lid.style.display='block'; lid.setAttribute('ry','11');
  eye.style.filter='brightness(.15)';
  setTimeout(()=>{ lid.setAttribute('ry','5'); eye.style.filter='brightness(.5)'; },120);
  setTimeout(()=>{ lid.style.display='none'; eye.style.filter=''; },280);
}

function overCreature(x,y){
  const s=document.getElementById('stage');if(!s)return false;
  const r=s.getBoundingClientRect();const pad=42;
  return x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad;
}
function spawnSpark(x,y){
  const el=document.createElement('div');el.className='sp';

}

const PET_MSGS=["Ooh that feels so nice! 🥰","More please! 💕","You have the best hands! ✨","So good! 😊","Best day ever! 🌟"];

function doAction(type){
  if(appState.sleeping&&type!=='pet'){speak("Shhh… tap me to wake up first! 😴");playCareSound('no');return;}
  const d=appState.lore;
  let msg='';
  if(type==='pet'&&appState.sleeping){
    appState.sleeping=false;removeSleepZ();speak("Yawn… good morning! 😊");hearts('💕',6);playCareSound('pet');return;
  }
  switch(type){
    case 'pet': msg=PET_MSGS[Math.floor(Math.random()*PET_MSGS.length)];reactPet();playCareSound('pet');break;
    case 'feed': msg=d.moods.feed;reactFeed();playCareSound('feed');break;
    case 'brush': msg=d.furry?d.moods.brush:d.moods.sparkle;if(msg==='N/A') msg='Feeling fresh! ✨';reactBrush();playCareSound('brush');break;
    case 'cuddle': appState.sleeping=true;addSleepZ();msg=d.sleepMsg;reactCuddle();playCareSound('cuddle');break;
    case 'acc': return;
  }
  speak(msg);hearts(HEART_ICONS[type]||'💕',7);
  appState.happy=Math.min(100,appState.happy+(THAPPY[type]||8));
  updateHappy();
  if(appState.happy>=80){const he=document.getElementById('heartEyes');if(he){he.style.display='block';setTimeout(()=>he.style.display='none',2500);}}
}

// ── RANDOM IDLE ACTIONS ──
function _doIdleAction(){
  const actions=['stretch','shake','lookAround','wiggle'];
  const action=actions[Math.floor(Math.random()*actions.length)];
  const st=el('stage');
  const bg=el('bodyGroup');
  if(!st) return;

  if(action==='stretch'){
    // Stretch tall then snap back
    let f=0;
    const iv=setInterval(()=>{
      f++;
      if(bg){
        const s=f<10 ? 1+f*.025 : f<20 ? 1.25-((f-10)*.025) : 1.0;
        const sx=f<10 ? 1-f*.012 : f<20 ? 1.12-((f-10)*.012) : 1.0;
        const breathe=Math.sin(animT*.038)*0.055;
        bg.style.transform=`scaleY(${s+breathe}) scaleX(${sx}) rotate(${_bodyLean.toFixed(2)}deg)`;
      }
      if(f>=22){ clearInterval(iv); }
    },40);

  } else if(action==='shake'){
    // Quick head/body shake
    let f=0;
    const iv=setInterval(()=>{
      f++;
      if(st) st.style.transform=`translateX(${Math.sin(f*1.8)*7}px) translateY(${Math.sin(animT*.028)*7}px)`;
      if(f>=16){ clearInterval(iv); if(st) st.style.transform=''; }
    },35);

  } else if(action==='lookAround'){
    // Pupils dart to one side then back
    const dir=Math.random()<0.5?1:-1;
    const pupils=document.querySelectorAll('#cSvg circle[fill="#111"]');
    pupils.forEach(p=>{ p.style.transform=`translate(${dir*5}px, 0px)`; });
    setTimeout(()=>{
      pupils.forEach(p=>{ p.style.transform=`translate(${dir*2}px, -1px)`; });
    },400);
    setTimeout(()=>{
      // Return control to eye tracking
      _lookAtX=dir*2; _lookAtY=-1;
    },700);

  } else if(action==='wiggle'){
    // Full body wiggle - the most fun one
    let f=0;
    const iv=setInterval(()=>{
      f++;
      if(st) st.style.transform=`rotate(${Math.sin(f*1.5)*10}deg) translateY(${Math.sin(animT*.028)*7}px)`;
      if(f>=18){ clearInterval(iv); if(st) st.style.transform=''; }
    },38);
  }
}

// ── DRAG & DROP ACCESSORY PLACEMENT ──
let _dragAcc=null;
let _dragGhost=null;
let _dragStartY=0;

function startAccDrag(accDef, evt){
  // Only drag owned accessories
  if(!getPurchasedForCreature().has(accDef.id)) return;
  _dragAcc=accDef;
  evt.preventDefault();

  // Create ghost element following finger
  _dragGhost=document.createElement('div');
  _dragGhost.className='drag-ghost';
  _dragGhost.innerHTML=`<svg viewBox="0 0 60 60" width="70" height="70" xmlns="http://www.w3.org/2000/svg">
    <g>${accDef.preview}</g></svg>`;
  document.body.appendChild(_dragGhost);

  const pos=_getTouchPos(evt);
  _dragStartY=pos.y;
  _moveDragGhost(pos.x, pos.y);

  // Listeners
  document.addEventListener('mousemove', _onDragMove);
  document.addEventListener('touchmove', _onDragMove, {passive:false});
  document.addEventListener('mouseup', _onDragEnd);
  document.addEventListener('touchend', _onDragEnd);
}

function _getTouchPos(evt){
  if(evt.touches&&evt.touches[0]) return {x:evt.touches[0].clientX, y:evt.touches[0].clientY};
  return {x:evt.clientX, y:evt.clientY};
}

function _moveDragGhost(x,y){
  if(!_dragGhost) return;
  _dragGhost.style.left=(x-35)+'px';
  _dragGhost.style.top=(y-35)+'px';
}

function _onDragMove(evt){
  evt.preventDefault();
  const pos=_getTouchPos(evt);
  _moveDragGhost(pos.x, pos.y);

  // If dragged upward significantly - close the tray
  if(_dragStartY - pos.y > 60){
    const panel=document.getElementById('accPick');
    if(panel.classList.contains('show')){
      panel.classList.remove('show');
    }
  }
}

function _onDragEnd(evt){
  document.removeEventListener('mousemove',_onDragMove);
  document.removeEventListener('touchmove',_onDragMove);
  document.removeEventListener('mouseup',_onDragEnd);
  document.removeEventListener('touchend',_onDragEnd);

  if(!_dragGhost||!_dragAcc){ _cleanDrag(); return; }

  // Get final drop position before removing ghost
  const finalPos=evt.changedTouches&&evt.changedTouches[0]
    ?{x:evt.changedTouches[0].clientX, y:evt.changedTouches[0].clientY}
    :{x:evt.clientX||0, y:evt.clientY||0};
  _dragGhost.remove(); _dragGhost=null;

  // Check if dropped on creature stage
  const stage=document.getElementById('stage');
  if(!stage){ _cleanDrag(); return; }
  const rect=stage.getBoundingClientRect();

  if(finalPos.x>=rect.left && finalPos.x<=rect.right &&
     finalPos.y>=rect.top  && finalPos.y<=rect.bottom){
    // Dropped on creature - place it at this position
    // Convert to SVG coordinates
    const cSvg=document.getElementById('cSvg');
    if(cSvg){
      const svgRect=cSvg.getBoundingClientRect();
      const svgVB=cSvg.viewBox.baseVal;
      const scaleX=(svgVB.width||220)/svgRect.width;
      const scaleY=(svgVB.height||220)/svgRect.height;
      const svgX=(finalPos.x-svgRect.left)*scaleX;
      const svgY=(finalPos.y-svgRect.top)*scaleY;
      _placeAccAtPosition(_dragAcc, svgX, svgY);
    }
  }
  _cleanDrag();
}

function _cleanDrag(){
  if(_dragGhost){ _dragGhost.remove(); _dragGhost=null; }
  _dragAcc=null;
}

function _placeAccAtPosition(accDef, cx, cy){
  const cSvg=document.getElementById('cSvg');
  if(!cSvg) return;

  // Remove existing instance
  const existing=cSvg.querySelector('#acc_'+accDef.id);
  if(existing) existing.remove();

  // Add to accSet
  if(!appState.accSet) appState.accSet=new Set();
  appState.accSet.add(accDef.id);

  // Render at natural position first so we can measure it
  const svgStr=accDef.svg(appState.color||'#ffb3d9');
  const ns='http://www.w3.org/2000/svg';
  const tmp=document.createElementNS(ns,'g');
  tmp.innerHTML=svgStr;
  const child=tmp.firstElementChild;
  if(!child) return;

  // Temporarily add to SVG to measure natural bounding box
  child.style.visibility='hidden';
  cSvg.appendChild(child);

  let dx=0, dy=0;
  try{
    const bbox=child.getBBox();
    // Natural center of accessory in SVG coordinate space
    const natCx=bbox.x + bbox.width/2;
    const natCy=bbox.y + bbox.height/2;
    // Translate so natural center lands at drop point
    dx=cx - natCx;
    dy=cy - natCy;
  }catch(e){
    // getBBox failed (e.g. not yet in DOM) - fall back to simple positioning
    const svgVB=cSvg.viewBox.baseVal;
    dx=cx - (svgVB.width||220)/2;
    dy=cy - (svgVB.height||220)/2;
  }

  // Apply transform and make visible
  child.setAttribute('transform', `translate(${dx.toFixed(1)},${dy.toFixed(1)})`);
  child.style.visibility='';

  // Store position for persistence
  if(!appState.accPositions) appState.accPositions={};
  appState.accPositions[accDef.id]={dx, dy};

  // Reactions
  speak(appState.lore?appState.lore.moods.acc||'I love it! 🥰':'Looking great! 🥰');
  hearts('🎉',4);
  playCareSound('acc');
  appState.happy=Math.min(100,(appState.happy||50)+5);
  updateHappy();
  buildAccPicker();
  buildShop();

  // Save via postMessage to parent
  try{ window.parent.postMessage({type:'saveAccPositions',
    accPositions:appState.accPositions,accSet:[...appState.accSet]},'*'); }catch(e){}
}

function buildAccPicker(){
  const row = document.getElementById('panelEquip') || document.getElementById('accRow');
  if(!row) return;
  row.innerHTML = '';
  const accs = getCreatureAccs();
  const owned = getPurchasedForCreature();
  const ownedAccs = accs.filter(a=>owned.has(a.id));

  if(ownedAccs.length===0){
    row.innerHTML='<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.3);font-size:.6rem;font-weight:800;padding:16px">Visit the Shop tab to get accessories! 🛒</div>';
    return;
  }

  ownedAccs.forEach(a => {
    const btn = document.createElement('div');
    const isOn = appState.accSet && appState.accSet.has(a.id);
    btn.className = 'acc-opt' + (isOn ? ' on' : '');
    btn.title = 'Drag onto creature to place, or tap to toggle';
    btn.innerHTML = `
      <svg viewBox="0 0 60 60" width="62" height="62" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible">
        <rect width="60" height="60" rx="8" fill="rgba(255,255,255,.05)"/>
        <g>${a.preview}</g>
      </svg>
      <div class="acc-opt-label">${a.label}</div>
      <div style="font-size:.38rem;color:rgba(255,255,255,.3);margin-top:2px">Drag to place</div>`;
    // Tap toggles on/off
    btn.onclick = () => toggleAccItem(a);
    // Drag to place
    btn.addEventListener('mousedown', e=>startAccDrag(a,e));
    btn.addEventListener('touchstart', e=>startAccDrag(a,e), {passive:false});
    row.appendChild(btn);
  });
}

function toggleAcc(){
  const panel = document.getElementById('accPick');
  const isShow = panel.classList.contains('show');
  if(isShow){
    panel.classList.remove('show');
  } else {
    panel.classList.add('show');
    buildAccPicker();
    buildShop();
    updateCoinBadge();
  }
}

function switchAccTab(tab){
  document.getElementById('tabEquip').classList.toggle('active', tab==='equip');
  document.getElementById('tabShop').classList.toggle('active', tab==='shop');
  document.getElementById('panelEquip').style.display = tab==='equip'?'':'none';
  document.getElementById('panelShop').style.display = tab==='shop'?'':'none';
}

function updateCoinBadge(){
  const el=document.getElementById('coinBadge');
  if(el) el.textContent='✨'+(appState.coins||0);
}

// ── ACCESSORY SHOP ──
function getPurchasedForCreature(){
  if(!appState.purchasedAccs) return new Set();
  return new Set(appState.purchasedAccs[appState.name]||[]);
}

function purchaseAcc(accDef){
  const cost=accDef.price||25;
  if((appState.coins||0)<cost) return;
  // Deduct coins
  appState.coins-=cost;
  updateCoinBadge();
  // Mark as purchased
  if(!appState.purchasedAccs) appState.purchasedAccs={};
  if(!appState.purchasedAccs[appState.name]) appState.purchasedAccs[appState.name]=[];
  if(!appState.purchasedAccs[appState.name].includes(accDef.id)){
    appState.purchasedAccs[appState.name].push(accDef.id);
  }
  // Auto-equip and enter drag mode
  buildShop();
  buildAccPicker();
  speak('I love it! ✨');
  hearts('💫',3);
  // Notify parent to save
  try{ window.parent.postMessage({type:'saveCoins',coins:appState.coins,
    purchasedAccs:appState.purchasedAccs},'*'); }catch(e){}
}

function buildShop(){
  const grid=document.getElementById('shopGrid');
  if(!grid) return;
  grid.innerHTML='';
  const accs=getCreatureAccs();
  const owned=getPurchasedForCreature();
  const equipped=appState.accSet||new Set();

  accs.forEach(function(a){
    const cost=a.price||25;
    const isOwned=owned.has(a.id);
    const isEquipped=equipped.has(a.id);
    const canAfford=(appState.coins||0)>=cost;
    const div=document.createElement('div');
    div.className='shop-item'+(isOwned?(isEquipped?' equipped':' owned'):(canAfford?'':' cant-afford'));

    const preview=`<svg viewBox="0 0 60 60" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
      <rect width="60" height="60" rx="8" fill="rgba(255,255,255,.04)"/>
      <g>${a.preview}</g></svg>`;

    if(isOwned){
      div.innerHTML=`<div class="shop-owned-badge">${isEquipped?'ON':'✓'}</div>`
        +preview
        +`<div class="shop-label">${a.label}</div>`
        +`<div class="shop-price" style="color:${isEquipped?'#ffe040':'#4dcf8a'}">${isEquipped?'Equipped':'Owned'}</div>`;
      div.onclick=function(){ toggleAccItem(a); buildShop(); };
    } else {
      div.innerHTML=preview
        +`<div class="shop-label">${a.label}</div>`
        +`<div class="shop-price">✨${cost}</div>`;
      if(canAfford){
        div.onclick=function(){
          if(confirm('Buy '+a.label+' for '+cost+' ✨ Shine Coins?')){
            purchaseAcc(a);
          }
        };
      }
    }
    grid.appendChild(div);
  });
}

function toggleAccItem(accDef){
  if(!appState.accSet) appState.accSet = new Set();
  const cSvg = document.getElementById('cSvg');
  if(!cSvg) return;

  if(appState.accSet.has(accDef.id)){
    // Remove this accessory
    appState.accSet.delete(accDef.id);
    const existing = document.getElementById('acc_' + accDef.id);
    if(existing) existing.remove();
    // Also try class-based removal for items without proper id
    cSvg.querySelectorAll('[id="acc_'+accDef.id+'"]').forEach(e=>e.remove());
  } else {
    // Add this accessory
    appState.accSet.add(accDef.id);
    const svgStr = accDef.svg(appState.color || '#ffb3d9');
    const ns = 'http://www.w3.org/2000/svg';
    const tmp = document.createElementNS(ns, 'g');
    tmp.innerHTML = svgStr;
    // Move all children into the SVG
    const child = tmp.firstElementChild;
    if(child) cSvg.appendChild(child);
    // Speak and react
    speak(appState.lore ? appState.lore.moods.acc || "I love it! 🥰" : "Looking great! 🥰");
    hearts('🎉', 4);
    playCareSound('acc');
    appState.happy = Math.min(100, appState.happy + 5);
    updateHappy();
  }
  buildAccPicker();
}

function removeAllAcc(){
  if(!appState.accSet) return;
  const cSvg = document.getElementById('cSvg');
  if(cSvg) cSvg.querySelectorAll('.acc-item, [id^="acc_"]').forEach(e => e.remove());
  appState.accSet = new Set();
  speak("Back to natural look! 😊");
  buildAccPicker();
}

// Keep appState.acc for compatibility but use accSet for stacking
function applyAcc(accDef){ toggleAccItem(accDef); }
function removeAcc(){ removeAllAcc(); }

function toggleLore(){document.getElementById('lore').classList.toggle('show');}

document.getElementById('btnBack').onclick=()=>{

  else history.back();

// ═══════════════════════════════════════════
//  CARE SOUND ENGINE
// ═══════════════════════════════════════════
let careCtx=null;

function getCareCtx(){
  if(!careCtx) careCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(careCtx.state==='suspended') careCtx.resume();
  return careCtx;
}

function careTone(freq,type,start,dur,vol,ctx){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.001,start+dur);
  o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+dur+.05);
}

function careSlide(f1,f2,type,start,dur,vol,ctx){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,start);o.frequency.linearRampToValueAtTime(f2,start+dur);
  g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.001,start+dur);
  o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+dur+.05);
}

function playCareSound(type){
  try{
    const ctx=getCareCtx();
    const t=ctx.currentTime;
    if(type==='pet'){
      // Soft warm purr-like tones
      careTone(523,'sine',t,.18,.25,ctx);
      careTone(659,'sine',t+.1,.18,.2,ctx);
      careTone(784,'sine',t+.2,.22,.18,ctx);
      careTone(1047,'sine',t+.3,.25,.15,ctx);
    } else if(type==='feed'){
      // Munching crunch - short percussive bursts
      [0,.1,.2,.3].forEach((dt,i)=>{
        careTone(220+i*30,'sawtooth',t+dt,.06,.35,ctx);
        careTone(440+i*20,'square',t+dt,.04,.15,ctx);
      });
      careTone(523,'sine',t+.4,.2,.2,ctx);
      careTone(784,'sine',t+.5,.2,.18,ctx);
    } else if(type==='brush'){
      // Gentle whoosh-sparkle
      careSlide(800,400,'sawtooth',t,.15,.12,ctx);
      [.12,.24,.36].forEach(dt=>{
        careTone(1047+Math.random()*200,'sine',t+dt,.1,.08,ctx);
      });
      careTone(1568,'sine',t+.4,.25,.1,ctx);
    } else if(type==='cuddle'){
      // Soft lullaby notes
      [523,494,440,392].forEach((f,i)=>{
        careTone(f,'sine',t+i*.25,.3,.18,ctx);
      });
    } else if(type==='no'){
      // Soft thud - rejection
      careSlide(300,180,'sine',t,.2,.2,ctx);
    } else if(type==='happy'){
      // Happy fanfare
      [523,659,784,1047].forEach((f,i)=>{
        careTone(f,'square',t+i*.07,.18,.3,ctx);
      });
    } else if(type==='acc'){
      // Sparkle jingle
      [1047,1319,1568,2093].forEach((f,i)=>{
        careTone(f,'sine',t+i*.06,.15,.2,ctx);
      });
    }
  }catch(e){}
}

});

  window.addEventListener('message', function(e){
    if(e.data&&e.data.type==='initCare'){
      const d=e.data;
      initCreature(d.name,d.color,d.word,d.happy,d.coins,d.purchasedAccs,d.accPositions);
    }
  });
  // Default init for standalone testing
  initCreature('Fluffkin','#ffb3d9','pounce',50,100,{},{});
});
